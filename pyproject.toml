[project]
name = "ks-shadowing"
version = "0.1.0"
description = "Shadowing detection for Kuramoto-Sivashinsky equation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    {name = "Travis Casey", email = "travis.w.casey@outlook.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.4.1",
    "scipy>=1.16.0",
    "tqdm>=4.0.0",
]

[project.urls]
Repository = "https://github.com/TravisCasey/ks-shadowing"

[project.scripts]
ks-detect = "ks_shadowing.cli.detect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ks_shadowing"]

[tool.hatch.build.targets.sdist]
only-include = [
    "CMakeLists.txt",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    ".clang-format",
    ".clang-tidy",
    ".gitmodules",
    "ty.toml",
    "uv.lock",
    "csrc",
    "data",
    "docs",
    "examples",
    "ks_shadowing",
    "tests",
]
exclude = [
    "docs/_build",
    "docs/auto_examples",
    "docs/__pycache__",
    "docs/sg_execution_times.rst",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["csrc/hera/upstream"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "UP", "SIM", "PTH", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # Magic values in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "sphinx>=9.1.0",
    "sphinx-gallery>=0.18.0",
    "ty>=0.0.11",
]
